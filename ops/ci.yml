name: CI

on:
  push:
    branches: [main, arena/01a076dc-agrisphere]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - name: Syntax check all sources
        run: |
          for f in server.js src/*.js test/*.js; do node --check "$f"; done
      - name: Smoke suite (130+ assertions incl. security, dignity, geotrace)
        run: npm test
        env:
          PORT: 3911
